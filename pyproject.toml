[project]
name = "ecg-ad-comparison"
version = "0.1.0"
description = "ECG anomaly detection comparison dashboard — VAE, LSTM, DDPM on PTB-XL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.3",
    "torchvision>=0.18",
    # Data
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "wfdb>=4.1",          # PTB-XL loading
    # Evaluation
    "scikit-learn>=1.5",
    # Visualization / Dashboard
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.35",
    # Utilities
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "kagglehub>=0.3",
    "python-dotenv>=1.0",
    "boto3>=1.43.123",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
]
