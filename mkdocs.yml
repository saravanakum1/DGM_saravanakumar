site_name: ECG Anomaly Detection — Model Comparison
site_description: End-to-end guide for preprocessing, training, and evaluating ECG anomaly detection models on PTB-XL and MIMIC-IV-ECG.
site_author: Saravanakumar Ramasamy

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Preprocessing:
      - Overview: preprocessing/overview.md
      - PTB-XL: preprocessing/ptbxl.md
      - MIMIC-IV-ECG: preprocessing/mimic.md
  - Training: training.md
  - Evaluation: evaluation.md
  - Dataset Switching: dataset-switching.md
  - Deployment: deployment.md
