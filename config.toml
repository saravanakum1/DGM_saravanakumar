[data]
# Dataset to use. Supported: "ptbxl", "mimic-iv-ecg"
# Switching this value is the only change needed to train on a different dataset.
name = "ptbxl"
# PTB-XL 500Hz
dataset_dir = "/kaggle/input/datasets/sharav95/ecg-ptbxl-data"
sampling_rate = 500
# MIMIC-IV-ECG
# name = "mimic-iv-ecg"
# dataset_dir = "/kaggle/input/datasets/sharav95/ecg-npy-batches"
# sampling_rate = 500
val_split = 0.1

[model]
latent_dim = 128
encoder_channels = [32, 64, 128]
encoder_kernels = [7, 5, 3]
encoder_strides = [2, 2, 2]
beta = 1.0

[training]
epochs = 50
batch_size = 64
learning_rate = 1e-3
# Device: "cpu", "cuda", or "mps" (Apple Silicon)
device = "cuda"

[anomaly]
# Percentile of NORM val reconstruction errors used as the anomaly threshold.
# Allowed values: 95 or 99
threshold_percentile = 95

[ddpm]
T = 500
beta_start = 1e-4
beta_end = 0.02
t_star = 20
vlb = false
ema_decay = 0.9999

[ddpm_training]
epochs = 15
batch_size = 64
learning_rate = 2e-4

[artifacts]
output_dir = "artifacts"
weights_file = "vae_weights.pt"
loss_file = "vae_loss.json"
norm_stats_file = "norm_stats.json"

[flow_matching]
epochs = 20
batch_size = 64
lr = 2e-4
weight_decay = 1e-4
grad_clip = 1.0
ema_decay = 0.9999
time_dim = 128
num_steps = 50
n_hutchinson = 1
score_samples = 50
threshold_percentile = 95
